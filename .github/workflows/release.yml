name: Release

# Versioned release is now MANUAL: it fires only on a GitHub "release" event
# (draft + publish a release in the repo UI) or via workflow_dispatch. It no
# longer auto-runs on push to main, so the protected-branch release push that
# broke CI is gone. semantic-release analyzes commits since the last tag,
# bumps the version, writes CHANGELOG.md, and creates the GitHub Release + tag
# (syntaxdiff_v<ver>) on the current main commit. It does NOT push a version
# bump back to main (the @semantic-release/git plugin was removed), so there is
# no protected-branch push to reject.
#
# Nightly image builds are handled separately by ci.yml (build-and-push), which
# runs on every push to main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
