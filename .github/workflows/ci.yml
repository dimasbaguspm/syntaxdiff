name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (semver from package.json)
        id: meta
        run: |
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "semver=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (<version>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.semver }}
            VITE_OTEL_COLLECTOR_URL=https://otel.dimasbaguspm.dev

      - name: Build and push image (latest / Nightly)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.semver }}
            VITE_OTEL_COLLECTOR_URL=https://otel.dimasbaguspm.dev

      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
