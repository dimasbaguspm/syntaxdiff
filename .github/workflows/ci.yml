name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (fmt / lint / types / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check src vite.config.ts vitest.config.ts
      - run: pnpm exec oxlint --vue-plugin .
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm exec vite build
      - run: pnpm exec vitest run

  build:
    name: Build and push image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "version=${TAG#syntaxdiff_v}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${{ github.repository }}:${TAG},ghcr.io/${{ github.repository }}:${TAG#syntaxdiff_v},ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=Nightly" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
            VITE_OTEL_COLLECTOR_URL=https://otel.dimasbaguspm.dev

  deploy:
    name: Deploy webhook
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "No DEPLOY_WEBHOOK_URL — skipping"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
